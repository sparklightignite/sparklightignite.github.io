name: Update YouTube videos

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/update_youtube_videos.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ -f youtube-videos.json ]; then git add youtube-videos.json; fi
          if [ -f site/youtube-videos.json ]; then git add site/youtube-videos.json; fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "."
          git push
